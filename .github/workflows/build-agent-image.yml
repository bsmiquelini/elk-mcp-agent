name: Build Agent Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-agent-image.yml"
      - "agent/**"
      - "mcp_server/**"
      - "scripts/**"
      - "config.yaml"
      - "agent/Dockerfile"
      - "mcp_server/Dockerfile"
      - "mcp_server/requirements.txt"
      - "agent/requirements.txt"
      - "scripts/requirements-seed.txt"
      - ".dockerignore"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/build-agent-image.yml"
      - "agent/**"
      - "mcp_server/**"
      - "scripts/**"
      - "config.yaml"
      - "agent/Dockerfile"
      - "mcp_server/Dockerfile"
      - "mcp_server/requirements.txt"
      - "agent/requirements.txt"
      - "scripts/requirements-seed.txt"
      - ".dockerignore"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_AGENT: ghcr.io/${{ github.repository_owner }}/elk-mcp-agent-agent
  IMAGE_NAME_MCP: ghcr.io/${{ github.repository_owner }}/elk-mcp-agent-mcp-server

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract agent metadata
        id: meta_agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_AGENT }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract MCP server metadata
        id: meta_mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_MCP }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build agent image for validation
        id: build-test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME_AGENT }}:ci-${{ github.sha }}
          labels: ${{ steps.meta_agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI mode
        run: |
          docker run --rm ${{ env.IMAGE_NAME_AGENT }}:ci-${{ github.sha }} agent/main.py --help

      - name: Smoke test HTTP mode
        run: |
          docker run --rm ${{ env.IMAGE_NAME_AGENT }}:ci-${{ github.sha }} agent/http_service.py --help

      - name: Trivy scan agent image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME_AGENT }}:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.69.3

      - name: Build MCP server image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp_server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME_MCP }}:ci-${{ github.sha }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test MCP server image
        run: |
          docker run --rm ${{ env.IMAGE_NAME_MCP }}:ci-${{ github.sha }} -m compileall mcp_server

      - name: Trivy scan MCP server image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME_MCP }}:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.69.3

      - name: Build and push agent image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_agent.outputs.tags }}
          labels: ${{ steps.meta_agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP server image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp_server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_mcp.outputs.tags }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Usage summary
        run: |
          {
            echo "## Runtime images"
            echo ""
            echo "- Agent image: \`${{ env.IMAGE_NAME_AGENT }}\`"
            echo "- MCP server image: \`${{ env.IMAGE_NAME_MCP }}\`"
            echo "- Agent tags:"
            echo '${{ steps.meta_agent.outputs.tags }}' | sed 's/^/- /'
            echo "- MCP server tags:"
            echo '${{ steps.meta_mcp.outputs.tags }}' | sed 's/^/- /'
            echo ""
            echo "CLI:"
            echo '\`\`\`bash'
            echo "docker run --rm -it ${{ env.IMAGE_NAME_AGENT }}:sha-${GITHUB_SHA::7}"
            echo '\`\`\`'
            echo ""
            echo "HTTP service:"
            echo '\`\`\`bash'
            echo "docker run --rm -p 8787:8787 ${{ env.IMAGE_NAME_AGENT }}:sha-${GITHUB_SHA::7} agent/http_service.py --host 0.0.0.0 --port 8787"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
