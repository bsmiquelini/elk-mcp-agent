name: Build Agent Container

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-agent-image.yml"
      - "agent/**"
      - "mcp_server/**"
      - "scripts/**"
      - "config.yaml"
      - "agent/Dockerfile"
      - "mcp_server/requirements.txt"
      - "agent/requirements.txt"
      - "scripts/requirements-seed.txt"
  pull_request:
    paths:
      - ".github/workflows/build-agent-image.yml"
      - "agent/**"
      - "mcp_server/**"
      - "scripts/**"
      - "config.yaml"
      - "agent/Dockerfile"
      - "mcp_server/requirements.txt"
      - "agent/requirements.txt"
      - "scripts/requirements-seed.txt"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/elk-mcp-agent-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build agent image for validation
        id: build-test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI mode
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} agent/main.py --help

      - name: Smoke test HTTP mode
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} agent/http_service.py --help

      - name: Build and push agent image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Usage summary
        run: |
          {
            echo "## Agent image"
            echo ""
            echo "- Image: \`${{ env.IMAGE_NAME }}\`"
            echo "- Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
            echo ""
            echo "CLI:"
            echo '\`\`\`bash'
            echo "docker run --rm -it ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
            echo '\`\`\`'
            echo ""
            echo "HTTP service:"
            echo '\`\`\`bash'
            echo "docker run --rm -p 8787:8787 ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7} agent/http_service.py --host 0.0.0.0 --port 8787"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
