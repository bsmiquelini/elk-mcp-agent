apiVersion: apps/v1
kind: Deployment
metadata:
  name: elk-mcp-agent
  namespace: observability-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elk-mcp-agent
  template:
    metadata:
      labels:
        app: elk-mcp-agent
    spec:
      containers:
        - name: agent
          image: registry.exemplo.intra/observability/elk-mcp-agent/agent:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "agent/http_service.py"]
          args: ["--host", "0.0.0.0", "--port", "8787"]
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: elk-mcp-agent-config
            - secretRef:
                name: elk-mcp-agent-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: dashboards
              mountPath: /app/artifacts
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: dashboards
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elk-mcp-agent
  namespace: observability-ai
spec:
  type: ClusterIP
  selector:
    app: elk-mcp-agent
  ports:
    - name: http
      port: 8787
      targetPort: http
